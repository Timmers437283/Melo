
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Melo — Messages, made simple.</title>
  <meta name="theme-color" content="#080808">
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
      --background: #080808;
      --panel: #111111;
      --border: #242424;
      --text: #f5f5f5;
      --muted: #858585;
      --green: #65d995;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--background);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    .container {
      width: 100%;
      max-width: 390px;
      padding: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 38px;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: #17251c;
      color: var(--green);
      font-size: 24px;
    }

    .brand-name {
      font-size: 29px;
      font-weight: 750;
      letter-spacing: -1.5px;
    }

    .card {
      padding: 30px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: var(--panel);
    }

    h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: -0.8px;
    }

    .subtitle {
      margin: 9px 0 26px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .warning {
      margin-bottom: 22px;
      padding: 11px 12px;
      border: 1px solid #353126;
      border-radius: 9px;
      background: #1c1912;
      color: #d8c89e;
      font-size: 12px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #d0d0d0;
      font-size: 12px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 43px;
      padding: 0 12px;
      border: 1px solid #303030;
      border-radius: 8px;
      outline: none;
      background: #090909;
      color: var(--text);
      font: inherit;
      font-size: 13px;
      transition: border-color 0.15s;
    }

    input:focus {
      border-color: var(--green);
    }

    input::placeholder {
      color: #626262;
    }

    button {
      width: 100%;
      height: 43px;
      margin-top: 5px;
      border: 0;
      border-radius: 8px;
      background: var(--green);
      color: #08130c;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: filter 0.15s, transform 0.15s;
    }

    button:hover {
      filter: brightness(1.08);
    }

    button:active {
      transform: scale(0.99);
    }

    .switch {
      margin: 23px 0 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .switch button {
      width: auto;
      height: auto;
      margin: 0;
      padding: 0;
      background: none;
      color: var(--green);
      font: inherit;
      font-weight: 600;
    }

    .status {
      margin-top: 15px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    footer {
      margin-top: 23px;
      color: #555;
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 480px) {
      .container {
        padding: 18px;
      }

      .card {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="brand">
      <div class="brand-icon">m</div>
      <div class="brand-name">melo</div>
    </div>

    <section class="card">
      <h1 id="heading">Create your account</h1>
      <p class="subtitle" id="subtitle">
        A little place for you and your people.
      </p>

      <div class="warning" id="warning">
        <strong>Privacy tip:</strong> Don't use your real name.
        Choose a display name your friends will recognize.
      </div>

      <form id="authForm">
        <div class="field">
          <label for="displayName">Display name</label>
          <input
            id="displayName"
            name="displayName"
            type="text"
            placeholder="What should friends call you?"
            maxlength="24"
            autocomplete="nickname"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="Create a password"
            minlength="8"
            maxlength="128"
            autocomplete="new-password"
            required
          >
        </div>

        <button type="submit" id="submitButton">
          Create account
        </button>
      </form>

      <p class="switch">
        Already have an account?
        <button type="button" id="switchMode">Sign in</button>
      </p>

      <p class="status" id="status" role="status">
        Your Melo number comes next.
      </p>
    </section>

    <footer>melo · just you and your people.</footer>
  </main>

  <script>
    const form = document.getElementById("authForm");
    const heading = document.getElementById("heading");
    const subtitle = document.getElementById("subtitle");
    const warning = document.getElementById("warning");
    const displayName = document.getElementById("displayName");
    const password = document.getElementById("password");
    const submitButton = document.getElementById("submitButton");
    const switchMode = document.getElementById("switchMode");
    const status = document.getElementById("status");

    let isSignIn = false;

    switchMode.addEventListener("click", () => {
      isSignIn = !isSignIn;

      heading.textContent = isSignIn
        ? "Welcome back"
        : "Create your account";

      subtitle.textContent = isSignIn
        ? "Pick up where you left off."
        : "A little place for you and your people.";

      warning.hidden = isSignIn;
      submitButton.textContent = isSignIn
        ? "Sign in"
        : "Create account";

      switchMode.textContent = isSignIn
        ? "Create an account"
        : "Sign in";

      password.autocomplete = isSignIn
        ? "current-password"
        : "new-password";

      password.placeholder = isSignIn
        ? "Enter your password"
        : "Create a password";

      status.textContent = isSignIn
        ? "Sign in will work once accounts are connected."
        : "Your Melo number comes next.";
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      status.textContent =
        "The interface is ready. Account creation will be connected next.";
    });
  </script>
</body>
</html>
