
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Melo</title>
  <meta name="theme-color" content="#08090c">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
      --background: #08090c;
      --panel: #111318;
      --border: #262a33;
      --text: #f5f6f8;
      --muted: #9298a5;
      --blue: #0a84ff;
      --blue-hover: #3195ff;
      --input: #0b0d12;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--background);
      color: var(--text);
      font-family: "Google Sans", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 390px;
      padding: 28px;
    }

    .card {
      padding: 30px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: var(--panel);
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.7px;
    }

    .subtitle {
      margin: 9px 0 26px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .warning {
      margin-bottom: 22px;
      padding: 11px 12px;
      border: 1px solid #283b52;
      border-radius: 9px;
      background: #121d2c;
      color: #b9d7fa;
      font-size: 12px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #d4d7df;
      font-size: 12px;
      font-weight: 500;
    }

    input {
      width: 100%;
      height: 43px;
      padding: 0 12px;
      border: 1px solid #30343e;
      border-radius: 8px;
      outline: none;
      background: var(--input);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      transition: border-color 0.15s;
    }

    input:focus {
      border-color: var(--blue);
    }

    input::placeholder {
      color: #777e8c;
    }

    button {
      width: 100%;
      height: 43px;
      margin-top: 5px;
      border: 0;
      border-radius: 8px;
      background: var(--blue);
      color: white;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover {
      background: var(--blue-hover);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .switch {
      margin: 23px 0 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .switch button {
      width: auto;
      height: auto;
      margin: 0;
      padding: 0;
      background: none;
      color: #58a6ff;
      font: inherit;
      font-weight: 600;
    }

    .switch button:hover {
      background: none;
      color: #8ac2ff;
    }

    .status {
      margin-top: 15px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
      overflow-wrap: anywhere;
    }

    footer {
      margin-top: 23px;
      color: #606674;
      font-size: 11px;
      text-align: center;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 480px) {
      .container {
        padding: 18px;
      }

      .card {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1 id="heading">Create your account</h1>

      <p class="subtitle" id="subtitle">
        A little place for you and your people.
      </p>

      <div class="warning" id="warning">
        <strong>Privacy tip:</strong> Don't use your real name.
        Choose a username your friends will recognize.
      </div>

      <form id="authForm">
        <div class="field">
          <label for="displayName">Username</label>
          <input
            id="displayName"
            name="displayName"
            type="text"
            placeholder="Enter your username."
            minlength="3"
            maxlength="24"
            pattern="[a-zA-Z0-9_]+"
            title="Use 3–24 letters, numbers, or underscores."
            autocomplete="username"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="Create a password"
            minlength="8"
            maxlength="128"
            autocomplete="new-password"
            required
          >
        </div>

        <button type="submit" id="submitButton">
          Create account
        </button>
      </form>

      <p class="switch">
        Already have an account?
        <button type="button" id="switchMode">Sign in</button>
      </p>

      <p class="status" id="status" role="status" aria-live="polite">
        Your Melo number comes next.
      </p>
    </section>

    <footer>melo · just you and your people.</footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://udpfctfddyfdugyszoig.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_deaxiyrXPKaZkIzT1L6g5g_DDT487sK";

    const form = document.getElementById("authForm");
    const heading = document.getElementById("heading");
    const subtitle = document.getElementById("subtitle");
    const warning = document.getElementById("warning");
    const displayName = document.getElementById("displayName");
    const password = document.getElementById("password");
    const submitButton = document.getElementById("submitButton");
    const switchMode = document.getElementById("switchMode");
    const status = document.getElementById("status");

    let isSignIn = false;
    let supabaseClient = null;

    if (
      window.supabase &&
      SUPABASE_URL !== "YOUR_PROJECT_URL" &&
      SUPABASE_PUBLISHABLE_KEY !== "YOUR_PUBLISHABLE_KEY"
    ) {
      supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

      status.textContent =
        "Supabase connected. Account setup is the next step.";
    } else {
      status.textContent =
        "Add your Supabase project details to connect Melo.";
    }

    switchMode.addEventListener("click", () => {
      isSignIn = !isSignIn;

      heading.textContent = isSignIn
        ? "Welcome back"
        : "Create your account";

      subtitle.textContent = isSignIn
        ? "Pick up where you left off."
        : "A little place for you and your people.";

      warning.hidden = isSignIn;

      submitButton.textContent = isSignIn
        ? "Sign in"
        : "Create account";

      switchMode.textContent = isSignIn
        ? "Create an account"
        : "Sign in";

      password.autocomplete = isSignIn
        ? "current-password"
        : "new-password";

      password.placeholder = isSignIn
        ? "Enter your password"
        : "Create a password";

      password.minLength = isSignIn ? 1 : 8;

      status.textContent = supabaseClient
        ? "Ready to connect your account."
        : "Add your Supabase project details to connect Melo.";
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!supabaseClient) {
        status.textContent =
          "Supabase isn't configured yet. Check your project URL and publishable key.";
        return;
      }

      status.textContent =
        "Supabase is connected, but account creation and sign-in still need to be implemented.";
    });
  </script>
</body>
</html>
